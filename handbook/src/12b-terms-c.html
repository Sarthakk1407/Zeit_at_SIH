<script>
Object.assign(TERMS, {

/* ---- the ones that were missing ---- */
"impulsive":["Describing noise made of short, violent, isolated events rather than a continuous sound — a gunshot rather than an engine. Statistically it means heavy-tailed: extreme values are far more common than a bell curve predicts.","The noise class PS 26052 names first, and the one almost no published speech-enhancement paper is tested on. Nearly every design decision here follows from it: percentile normalisation instead of RMS, a detect-and-react path instead of prediction, and α-stable augmentation instead of Gaussian."],
"impulse":["A single, very short, very loud acoustic event.","Our measurement engine describes each one with sixteen quantities — peak SPL, rise time, A- and B-duration, and the ⅓-octave spectrum among them."],
"stationary":["Noise whose statistical properties do not change over time — engine hum, fan noise, a generator.","The easy case, where the neural core is strongest and BMRI is admittedly weak. That complementarity is why the architecture has two paths rather than one."],
"non-stationary":["Noise whose properties change as you listen — wind gusts, a vehicle passing, babble that thins and thickens.","Handled by the neural core together with the live classifier, which retunes γ and β every frame instead of being tuned once."],
"gunshot":["Not one sound but four: the ballistic crack, the muzzle blast, the mechanical action of the weapon, and the environment's reflections — each arriving at a different time.","Our capture plan records the mechanical layer separately at close range and high gain, because the blast buries it in any single take. Almost nobody does this, and it is what makes a synthetic shot sound like a weapon rather than a bare pressure pulse."],
"hop":["How far the analysis window advances between frames. A 10 ms hop with a 20 ms frame gives 50 % overlap.","It sets how often the entire eleven-block chain has to run, and therefore the compute deadline: 10 ms of work per 10 ms of audio."],
"latency":["The delay between sound arriving and processed sound leaving. Algorithmic latency is what the mathematics forces; processing latency is what the computation costs.","Our budget is 25.3 ms end to end for Lane B and under 1 ms for Lane A. The second number is not a stricter version of the first — it is a different physical problem."],
"inference":["Running a trained model forward on new input, as opposed to training it.","The only machine-learning work that happens on the device. Everything else — data generation, training, pruning, quantisation — happens on a workstation and never ships."],
"Aux-IVA":["Auxiliary-function Independent Vector Analysis (Ono, 2011). A blind separation method with no step size to tune and a guarantee of improvement at every iteration.","Block 2. H-GTCRN reports it costs 0.20 MMAC per second per iteration and almost no parameters, which is what makes a classical separation stage affordable ahead of the network."],
"BMRI":["Binary Mask Residual Interpolation (Ruhland et al., 2015). A classical two-stage method: an adaptive threshold splits each block into target and residual, an autoregressive model flags impulses in the residual, and those samples are interpolated from their neighbours.","Block 6, our impulsive path — but deliberately scoped. It was validated on white Cauchy noise for music restoration, not gunshots, and it is known to degrade transients. We use it for the ballistic crack and the mechanical layer, not for a 200 ms muzzle blast."],
"Deep ANC":["Zhang & Wang, 2021. Reframes active noise control as supervised learning: a network predicts the anti-noise waveform, which a loudspeaker emits.","Our principal baseline, and the one we attack. It was never tested on impulsive noise, and its latency trick depends on prediction — which is exactly what a gunshot defeats."],
"H-GTCRN":["A hybrid dual-channel system: Aux-IVA does a cheap blind first pass, and a modified GTCRN refines it, conditioned on both the raw noisy input and the separated streams.","Three of our design decisions come straight from its ablation study: mask the noisy input rather than the separated estimate, use log-power features on the separation branch, and feed the network both the speech and the noise streams."],
"DeepFilterNet2":["A two-stage enhancement model: coarse real-valued gains on 32 ERB bands, then complex deep filtering below 5 kHz to rebuild harmonic detail.","Our source for block 8, and our existence proof for embedded deployment — it runs in real time on a Raspberry Pi 4."],
"NOISEX-92":["A 1993 database and controlled signal-to-noise framework for testing speech systems under additive noise.","Its noise set — engine, factory, babble, speech-shaped noise — is what nearly every later paper inherits, and none of it is impulsive. That inheritance is the blind spot this project exists to measure."],
"Widrow":["Bernard Widrow, whose 1975 paper defined adaptive noise cancelling: a primary input carrying signal plus noise, a reference input carrying correlated noise, adaptively filtered and subtracted.","The origin of our microphone layout, and of the constraint that decides it — if the reference microphone contains any of the wearer's voice, the filter is forced to cancel the voice."],
"Gaussian":["The familiar bell curve. Extreme values are very rare, and the variance is finite.","The assumption underneath RMS normalisation and squared-error losses — and the assumption impulsive noise violates, which is why both are the wrong tools here."],
"Cauchy":["An α-stable distribution with α = 1. Famously has no defined mean or variance.","The noise BMRI was actually validated on, at kurtosis 27. A gunshot is far more extreme, which is why we scope BMRI narrowly rather than claiming it covers our case."],
"saturation":["What happens when a signal exceeds what a device can represent: the peaks flatten and the information in them is destroyed.","Decided at the microphone and irreversible. Every published paper models the loudspeaker saturating on the output side; nobody models the microphone saturating on the input side, even though that is what actually happens on a range."],
"convolution":["The operation that applies one signal's character to another. Convolve a dry gunshot with a room's impulse response and you hear that gunshot in that room.","Used twice: in the generator, to place synthetic blasts in the measured range acoustics; and inside the network, where it is the layer type that detects local time-frequency patterns."],
"HRTF":["Head-Related Transfer Function — a measured, frequency-dependent description of how a particular head and ears alter incoming sound.","The correct way to simulate two microphones on one head. The closest prior work uses a flat −10 to 0 dB scaling instead, which cannot reproduce the frequency dependence its own figures show."],
"spherical spreading":["Sound energy spread over an expanding sphere, so level falls 6 dB for every doubling of distance.","Step 4 of the synthetic generator, and the reason distance is the only real control over microphone clipping."],
"RIR":["Room Impulse Response — an impulse response for an enclosed space specifically.","Training across a wide spread of these, from open field to armoured vehicle interior, is what makes a generalisation claim real. The closest prior work used a single 3 × 4 × 2 m room."],
"Schroeder":["Backward integration of a squared impulse response, which turns a noisy decay into a smooth curve a straight line can be fitted to.","How RT60 is actually computed in our toolkit, per octave band, with the fit quality reported so a bad measurement is visible rather than silent."],
"sweep":["An exponential sine sweep — a tone rising smoothly through every frequency — used to measure an impulse response by deconvolution.","Preferred over a balloon pop because it puts far more energy into the room. Our generator verifies the peak-to-sidelobe ratio before the trip: above 40 dB required, typically 54 dB achieved."],
"thread":["An independent line of execution within a program.","The engine uses three: a real-time audio callback that only copies samples, a high-priority processing thread running blocks 2 to 11, and a normal-priority control thread that never touches the signal path."],
"jitter":["Variation in timing between iterations, as opposed to average delay.","Low average latency with high jitter still produces audible clicks, which is why the figure we publish is the 99th-percentile frame time rather than the mean."],
"Jetson":["NVIDIA's embedded AI platform. The problem statement names the AGX Orin as a reference target.","At 39.6 MMAC per second our model very probably does not need one — and demonstrating that on a Raspberry Pi is itself the size, weight and power argument for a soldier-worn device."],
"ARM":["The processor architecture used by essentially every embedded and mobile device, including the Raspberry Pi.","Cross-compiling to it is a first-class requirement in the build system, which is why CMake and header-only libraries were chosen."],
"parity test":["Running two implementations on identical inputs and asserting they agree at every intermediate stage, not just at the output.","The defence against the failure that costs a week: the C++ engine quietly producing slightly different numbers from the Python it was trained as. Nothing crashes; the model just performs worse than it did in training."],
"ONNX Runtime":["The cross-platform engine that executes ONNX models, including on ARM. MIT licensed.","How the trained model actually runs inside the C++ engine. The licence matters: a GPL dependency in a defence deliverable is a conversation nobody wants."],
"PFFFT":["A small, single-file, BSD-licensed fast Fourier transform library.","Chosen deliberately over FFTW, which is GPL or paid. The FFT dominates our compute budget, so this is not an incidental dependency."],
"GRU":["Gated Recurrent Unit — a recurrent layer with gates controlling what to remember and what to forget. Smaller than an LSTM.","What GTCRN uses, both across frequency within a frame and across time between frames."],
"Adam":["The standard optimiser — the algorithm deciding how to adjust weights given the gradient, adapting its step size per parameter.","Used with a learning rate of 1e-3, halved on plateau. H-GTCRN instead uses linear warm-up with cosine annealing."],
"epoch":["One complete pass through the training data.","Ours are generated on the fly from a seeded configuration, so signal-to-noise ratio and room response are resampled every epoch rather than fixed once."],
"SI-SDR":["Scale-Invariant Signal-to-Distortion Ratio — a corrected version of SDR that allows only a single overall gain adjustment.","What we report instead of SDR, because Le Roux et al. showed SDR can stay flat or even rise while a signal is being destroyed by masking — which is precisely what our system does."],
"SDR":["Signal-to-Distortion Ratio as implemented in the widely used BSS-Eval toolkit.","Reported here only to explain why we do not use it. It permits a 512-tap filter to reshape the reference, which means it can be satisfied by an output that sounds nothing like the target."],
"ESTOI":["Extended STOI, more reliable than STOI when the noise is strongly modulated.","Worth reporting alongside STOI for impulsive conditions, where the noise is the opposite of steady."],
"P.835":["An ITU subjective testing standard that separates speech quality from background quality rather than giving one overall score.","The basis of DNSMOS SIG and BAK — and the reason those two numbers together make over-suppression visible where a single score hides it."],
"SIG":["The DNSMOS speech-quality score, 1 to 5, judged independently of the background.","The number that falls when a denoiser starts eating the voice. GTCRN scores 3.00 against a noisy input of 3.20 on its own blind test set — it degrades speech while improving background suppression."],
"BAK":["The DNSMOS background-quality score, 1 to 5, judged independently of the speech.","High BAK with falling SIG is the signature of over-suppression: the noise is gone and so is the voice. Reporting them separately is what makes that visible."],
"MOS":["Mean Opinion Score — the average rating human listeners give, 1 to 5.","What every objective metric in this project is ultimately trying to predict."],
"phantom power":["48 V sent up a balanced microphone cable to power a condenser capsule.","Switchable on the UMC202HD. A dynamic microphone does not need it, and a dynamic capsule is preferred for close blast work because it has no active electronics to overload."],
"balanced":["A cable carrying the signal twice, once inverted, so interference picked up along the way cancels when the two are recombined.","Matters more than it sounds on a prototype with a switching power supply and a cooling fan a few centimetres from the microphone lead."],
"XLR":["The three-pin connector used for balanced professional audio.","Both microphones connect to the interface this way, through its combination XLR/TRS input jacks."],
"throttling":["A processor reducing its own clock speed to stay within thermal or power limits.","The reason two items on the parts list are marked not optional. Both the official cooler and the official power supply exist to prevent latency figures drifting for reasons that have nothing to do with the code."],
"Raspberry Pi 5":["A single-board computer with a quad-core Arm Cortex-A76 at 2.4 GHz, on an 85 × 56 mm board.","The prototype's compute platform. Choosing it over the Jetson the problem statement suggests is a deliberate argument about size, weight, power and cost for a device a soldier has to carry."],
"BOM":["Bill of materials — the itemised list of every part needed to build something, with quantities and costs.","Ours is short and every line has a reason attached. Two entries are marked not optional, because omitting them produces failures that look like software bugs."],
"SPL":["Sound Pressure Level, in decibels relative to 20 micropascals.","Every level in our dataset is absolute rather than relative, because of a calibration tone recorded alongside a meter reading. Without that step no measurement can be compared with physics or with anyone else's data."],
"Mach":["A speed expressed as a multiple of the speed of sound. Mach 2.4 is roughly 820 m/s.","Typical for a rifle round, and the reason the ballistic crack reaches the listener before the muzzle blast does."],
"shockwave":["The abrupt pressure discontinuity a supersonic object drags behind it.","Generated along the bullet's path rather than at the weapon — which is why it arrives from much closer, and much earlier, than the muzzle blast."],
"undervoltage":["A supply failing to hold its rated voltage under load.","With a generic charger the Raspberry Pi 5 falls back from 5 A to 3 A and throttles. The symptom is intermittent latency spikes with nothing in the code to explain them."],
"provenance":["Being able to say where every number came from, and prove it has not changed since.","Enforced here by absolute calibration, a holdout assigned before any data exists, checksums over both the recordings and the measurement code, and a guard that refuses to process synthetic test audio as if it were real."],
"calibration":["Recording a known reference tone alongside a sound-level meter reading, so digital sample values can be converted to absolute pressure.","The single step that decides whether the whole dataset is measurement or merely audio. It cannot be added afterwards, and changing the recorder gain voids it."],
"kurtosis":["A statistic describing how heavy a distribution's tails are — how prone it is to extreme values. Gaussian noise scores 3.","Block 5's input, and the mechanism that makes the system adaptive rather than merely tuned. Steady noise sits near 3, the Cauchy noise BMRI was tested on measures 27, and a gunshot is far higher."],
"SIH":["Smart India Hackathon — the national competition under which this problem statement was issued.","Up to 500 teams may submit against one problem statement; roughly five to seven reach the grand finale, judged over 36 hours by industry professionals alongside the sponsoring organisation's own scientists."]

});
</script>
