<script>
// [definition, how it is used in this project]
var TERMS = {
"dashed underline":["A word marked as a technical term in this document.","Hover or tap it and you get the definition plus how it is used here. There is no glossary to scroll to."],

/* ---------- acoustics and measurement ---------- */
"dB SPL":["Sound pressure level in decibels relative to 20 micropascals, the quietest pressure a young ear detects. Speech ~65 dB, shouting ~90 dB, muzzle blast 140–155 dB.","Every level in our dataset is in absolute dB SPL because of the calibration tone. Without it, levels would be relative forever and could not be compared with physics or with anyone else's measurement."],
"decibel":["A logarithmic ratio, not an absolute unit. +6 dB doubles the pressure; +20 dB is ten times.","Used logarithmically because hearing is, and because a gunshot event spans ~100 dB, which is unmanageable linearly."],
"Pascal":["The SI unit of pressure. Sound is a pressure fluctuation in air.","calibrate.py converts our arbitrary digital samples into Pascals: scale = p_rms / rms_fullscale. That conversion is what makes a level claim absolute."],
"dBFS":["Decibels relative to digital full scale — how close a sample is to the maximum the format can represent. 0 dBFS is the ceiling; everything is negative.","Meaningless as a physical level until calibrated. Our gain target at the range is −18 to −12 dBFS on a proxy pop."],
"A-weighting":["A filter mimicking the ear's reduced sensitivity to low frequencies before measuring level.","We deliberately do NOT use it. Impulse noise is measured unweighted (Z-weighted) because the low-frequency energy is real and damaging."],
"peak SPL":["The single loudest instantaneous pressure in an event.","The primary impulse-noise number, and what MIL-STD-1474 limits to 140 dB at the ear. It is also the one number the whole range trip exists to obtain, which is why the limiter stays off."],
"SEL":["Sound Exposure Level — total event energy normalised to one second.","Lets a short crack and a long boom be compared fairly. They can share a peak but differ hugely in energy, so recording only peak gives half the picture."],
"Leq":["Equivalent continuous level — the steady sound that would carry the same energy as the fluctuating one measured.","One of the 16 quantities analyze.py produces per event."],
"crest factor":["Peak divided by RMS, in dB. How tall the peak is relative to the average.","A gunshot's crest factor is enormous, which is exactly what breaks ordinary audio processing — and why 24-bit is required so the quiet detail does not sit in the quantisation floor."],
"kurtosis":["The fourth statistical moment — how heavy a distribution's tails are, i.e. how prone it is to extreme values. Gaussian noise = 3.","Block 5's input. Steady noise sits near 3, the Cauchy noise BMRI was validated on measures 27, a gunshot is far higher. The classifier reads it and sets γ and β, which is what makes the system 'adaptive'."],
"noise floor":["The quietest level a recording chain can represent — its own self-noise.","Recorded for 60 s with the mic covered at the start of every session. Every SNR in the dataset is measured against it."],
"dynamic range":["The span between the loudest and quietest thing a system can capture.","A gunshot event spans ~100 dB — 155 dB peak down to a 40 dB floor — which is why we record two channels 18–24 dB apart in gain."],
"impulse noise":["Noise made of short, violent, isolated events. Statistically heavy-tailed.","The noise class PS 26052 names first, and the one almost no speech-enhancement paper is tested on. Filling that gap is the project's central contribution."],
"stationary":["Noise whose statistical properties do not change over time — engine hum, fan noise, generator drone.","The easy case, and where the neural core is strongest. Also where BMRI is admittedly weak, which is why the two paths are complementary."],
"non-stationary":["Noise whose properties change — wind gusts, a passing vehicle, babble that thins and thickens.","Handled by the neural core plus the live classifier retuning per frame."],
"transient":["A short event with a fast attack.","Gunshots are transients — but so are speech plosives /p/ /t/ /k/. That is why BMRI, which is known to degrade transients, must be scoped narrowly."],
"muzzle blast":["The pressure wave from propellant gas leaving the barrel. 140–155 dB at close range.","The dominant component of the noise we are cancelling, and the one that saturates the capsule. Idealised by the Friedlander wave in our generator."],
"ballistic crack":["The cone-shaped shockwave a supersonic bullet drags behind it. Because the bullet outruns sound, it always arrives before the muzzle blast.","The only genuine look-ahead available to a headset — tens of milliseconds — and the defensible replacement for the overclaimed geometric look-ahead (audit F3)."],
"N-wave":["The characteristic pressure shape of a ballistic shockwave: sharp rise, linear fall, sharp recovery — like the letter N.","What a balloon pop approximates, which is why balloons are a useful free proxy source at the range."],
"Friedlander wave":["The standard idealisation of a blast: instant rise to peak overpressure, exponential decay, then a negative underpressure phase. p(t) = Ps·(1−t/T₀)·e^(−b·t/T₀).","Three parameters — Ps, T₀, b — which is what makes it a generator rather than a recording. Already in make_test_data.py, but currently uncited, which is the one physical assumption under the whole pipeline with no source behind it."],
"rise time":["Time from 10% to 90% of peak on the leading edge.","What separates a gunshot from a drum hit, and the most fragile number we measure: muzzle-blast rise is 10–50 µs and one sample at 96 kHz is 10.4 µs. This is why the sample rate is not negotiable."],
"A-duration":["The initial positive pressure phase of a blast.","A classic blast-wave metric tied directly to physics, and one of the three timing quantities per event."],
"B-duration":["Total time the envelope stays within 20 dB of the peak.","The standard duration measure for impulse noise, and part of the MIL-STD-1474 criteria."],
"impulse response":["How a space or device responds to an instantaneous impulse. Convolve any sound with a room's IR and you hear that sound in that room.","Measured at the range by exponential sine sweep, with a balloon pop as fallback. It cannot be recovered after leaving, so it is captured before anything that can be shortened."],
"RT60":["Reverberation time — how long a sound takes to decay by 60 dB. A field is near zero; a metal vehicle interior is long and harsh.","Computed per octave band from 62.5 Hz to 8 kHz by Schroeder backward integration, with T20 and T30 fits. Only meaningful when direct-to-noise exceeds ~35 dB."],
"Deconvolution":["Convolution run backwards — recovering the impulse response from a recorded sweep.","How ir_extract.py works: a linear zero-padded FFT multiply against the matched inverse filter, then trim to 5 ms before the direct sound."],
"atmospheric absorption":["Air absorbs sound, strongly at high frequencies and strongly dependent on temperature and humidity.","Why temp_c and humidity_pct are logged by hand. At 10 kHz over 10 m the difference between 30% and 80% humidity is several dB — and high frequency is exactly where synthetic gunshots go wrong."],
"ground reflection":["Sound bouncing off the ground and arriving slightly later than the direct path.","Modelled in generator step 6 from the logged mic and muzzle heights and the ground surface. It produces comb filtering, which is a very visible fingerprint of geometry."],
"comb filtering":["The regularly spaced peaks and notches produced when a signal is added to a slightly delayed copy of itself. It looks like a comb.","The visible signature of ground reflection in our measured ⅓-octave spectra, and one of the things a synthetic shot must reproduce to be credible."],
"head shadow":["The head physically blocking sound on its way to the far ear, far more at high frequencies than low.","The closest prior work models it as a flat −10 to 0 dB scaling. We use published HRTF data instead, because real head shadow is strongly frequency-dependent."],
"Lombard effect":["People involuntarily change how they speak in noise — higher pitch, more level, shifted spectral tilt.","The largest dataset gap in the project. Systems trained on calm read speech lose ~5 dB on Lombard speech even after level matching, and our entire use case is someone shouting under fire. Target ≥20% Lombard GRID content."],
"staggered-gain array":["Two microphones recording the same event at sensitivities 18–24 dB apart.","The hot channel clips on the blast and captures the tail; the cold channel exists only to catch the peak unclipped. validate.py --array forgives hot-channel clipping so operators do not learn to ignore warnings."],
"proximity effect":["A directional microphone boosting low frequencies when very close to the source.","A boom mic sits 2–5 cm from the mouth; clean speech corpora are recorded at ~30 cm. Emulate it with a low-shelf boost before mixing, or the model learns the wrong voice."],
"directivity":["A source radiating differently in different directions.","A muzzle blast is far louder in front of the weapon than behind it, which is why azimuth_deg is logged and applied as generator step 3."],
"circularity":["Tuning something on data and then evaluating it on that same data.","The most common way a project convinces itself it works, and the first thing a sharp reviewer probes. Prevented here by assigning fit/holdout at planning time, before any data exists."],

/* ---------- signal processing ---------- */
"STFT":["Short-Time Fourier Transform — chop audio into short overlapping slices and find the frequency content of each. The result is a spectrogram.","Block 4. We keep the complex form so phase survives. 20 ms frame with a 10 ms hop in the engine; GTCRN as published uses 32/16 ms, which is audit finding F6."],
"spectrogram":["The picture an STFT produces: time across, frequency up, energy as brightness.","Speech looks like stacked horizontal stripes; a gunshot looks like a vertical wall. The demo shows live impulse markers on one."],
"frame":["One slice of audio fed to the transform.","Ours is 20 ms. You cannot process a frame until all of it has arrived, which is where 20 of our 25.3 ms of algorithmic latency comes from."],
"window function":["A smooth taper applied to each frame so its edges fade to zero, preventing artificial discontinuities from creating false frequencies.","A square-root Hann window, chosen so that with 50% overlap the analysis and synthesis windows sum to exactly one and overlap-add reconstruction is perfect."],
"overlap-add":["Reconstructing a continuous waveform by summing overlapping processed frames.","Block 11. With the right window and hop the overlaps sum to one and the joins are inaudible. Perfect STFT→ISTFT reconstruction is step 3 of the C++ build order, before any DSP."],
"magnitude":["How much energy sits at a frequency bin.","Half of what a complex spectrum carries. H-GTCRN found a magnitude-only log-power feature beat the full complex feature on its separation branch."],
"phase":["Where in its cycle a frequency component sits — the timing information.","Kept throughout our chain so the output is not smeared. But 'phase always matters' is too strong: H-GTCRN explicitly concluded phase 'is not as crucial' for its IVA branch."],
"ERB":["Equivalent Rectangular Bandwidth — a scale grouping frequencies the way the ear does: narrow at low frequency, wide at high.","Where most of GTCRN's efficiency comes from. It maps 192 high bins to 64 ERB bands while keeping 65 low bins intact, giving a 129-dimensional feature map."],
"harmonic structure":["Voiced speech has energy at regular multiples of the pitch frequency.","Coarse per-band masking flattens these, which is what makes over-processed speech sound robotic. Block 8's deep filtering exists to rebuild them."],
"masking":["Applying a set of gains, one per time-frequency point, to keep the speech and suppress the noise.","The dominant paradigm in learned speech enhancement, and what block 7 produces. H-GTCRN's ablation says apply it to the noisy input, not to the separated estimate."],
"mask":["A set of per-time-frequency gains saying how much of the noisy signal to keep at each point.","Multiply the noisy spectrum by it and the noise is suppressed. GTCRN predicts a complex one."],
"complex ratio mask":["A mask that is itself complex, so it corrects phase as well as magnitude.","What GTCRN actually outputs, bounded to ±1 by a tanh activation on the last decoder block."],
"RMS":["Root Mean Square — the square root of the mean of the squared samples. The standard measure of average level.","Block 3 deliberately does NOT use it. RMS is built on variance, and for heavy-tailed impulsive noise the variance is infinite, so RMS is not fragile here — it is undefined."],
"heavy-tailed":["A distribution where extreme values are far more likely than a Gaussian would predict.","The defining statistical property of impulsive noise, and the reason variance-based methods like RMS normalisation and squared-error losses are the wrong tools."],
"variance":["The average squared deviation from the mean — the standard measure of spread.","For α-stable distributions with α below 2 it is infinite. That single fact invalidates RMS normalisation and motivates FLOM."],
"α-stable":["A family of distributions where α (0 to 2) sets tail heaviness. α=2 is Gaussian, α=1 is Cauchy, smaller means more violent spikes.","Our augmentation, at α≈1, replacing Gaussian noise injection. We also deliberately generate below α=0.5 and let it clip — the regime the original authors excluded, for exactly the reason they excluded it."],
"FLOM":["Fractional Lower-Order Moments (Shao & Nikias, 1993) — statistics built on a power below 2, which stay finite when variance does not.","The principled replacement for RMS in block 3. It ships on the device, so the primary paper should be obtained rather than cited through Yuan et al."],
"LMS":["Least Mean Squares — the classic adaptive filter (Widrow, 1975). It nudges its coefficients a little at a time in the direction that reduces an error signal.","Block 10, optional, about twenty lines. Must be driven by Mic 2, the noise reference — not by Mic 3, which belongs to Lane A (audit F2)."],
"FxLMS":["Filtered-x LMS — LMS adapted for active noise control, where the anti-noise passes through a loudspeaker and air before reaching the error mic. It filters the reference by an estimate of that path first.","Lane A's algorithm. It runs on a DSP inside the sub-millisecond budget, where no neural network fits."],
"step size":["How large an adjustment an adaptive filter makes each iteration. Too small and it never converges in time; too large and it oscillates.","Aux-IVA's main appeal is having none at all, and being guaranteed to improve every iteration — which is what makes it usable in real time."],
"destructive interference":["Two sound waves of opposite phase adding to silence.","The physical principle Lane A rests on, and the reason its budget is sub-millisecond: the anti-noise has to reach the eardrum before the real sound does."],
"Independent Vector Analysis":["A blind source separation method that finds an un-mixing making outputs statistically independent, while keeping each source's frequency bins tied together.","Block 2. The 'tied together' part is what fixes ICA's tendency to scatter one source across several outputs."],
"ICA":["Independent Component Analysis — the classic blind separation method, maximising statistical independence between outputs.","IVA's predecessor. Its weakness is the permutation problem across frequency, which IVA solves."],
"statistically independent":["Knowing one signal tells you nothing about the other.","The assumption Aux-IVA separates on. It holds well for a voice and a gunshot, less well for correlated environmental sources."],
"permutation ambiguity":["Blind separation gives you separated sources but not their identities. Output 1 might be the voice, or the engine.","Why the Aux-IVA outputs should be labelled 'three separated streams, unordered'. We sidestep it by feeding all of them to the network and letting it decide."],
"scaling ambiguity":["Blind separation also does not preserve loudness — each separated source emerges at an arbitrary level.","Another reason the separated streams are conditioning inputs rather than a finished result."],
"underdetermined":["More sources than microphones, so exact separation is impossible.","A battlefield has voice, blast, engine, wind and babble against three mics. Worth saying plainly rather than claiming three mics separate three noise classes."],
"AR model":["Autoregressive — predicts each sample from a weighted sum of the previous few. 'Order 16' means it looks back sixteen samples.","Block 6's detector. Where reality diverges sharply from the prediction, that sample is flagged as an impulse and interpolated out."],
"prediction":["Estimating future signal values from past ones.","The mechanism Deep ANC uses to claw back latency, at 1.5–1.7 dB per 10 ms on periodic noise. It cannot work on a gunshot, and that single fact is why our architecture detects and reacts instead."],
"underrun":["The sound card needing samples that are not ready yet. Heard as a click.","The failure the entire real-time design exists to prevent, and why the audio callback never allocates, locks, logs or throws."],
"lock-free ring buffer":["A fixed-size circular queue letting threads share data without a mutex.","Hand-written, single-producer single-consumer. Fixed size means it never allocates; lock-free means the audio thread can never be made to wait an unbounded time."],
"callback":["A function the audio driver calls whenever it needs samples.","Runs at real-time priority. Block 1 lives here and does almost nothing on purpose."],
"vocoder":["A coder that transmits a parametric description of speech — pitch, voicing, spectral envelope — rather than the sound itself, and re-synthesises it at the far end.","The stage after our whole chain, and currently missing from the design. Every metric should be reported both before and after it."],
"MELPe":["Mixed-Excitation Linear Prediction enhanced — the NATO and US DoD military vocoder, at 2400, 1200 or 600 bits per second.","What a tactical radio actually transmits. It has its own noise pre-processor, which ours may fight with — a measurable question nobody at SIH will have asked."],
"STANAG":["A NATO Standardisation Agreement. STANAG 4591 made MELPe the alliance's narrowband voice codec in 2002.","The reason a defence communications evaluator will ask about the vocoder before asking about the model."],
"software-defined radio":["A radio whose signal processing is done in software rather than fixed circuitry.","DRDO-designed SDRs built by BEL are being inducted by the Indian Army — the plausible far end of our link, and worth naming."]
};
</script>
