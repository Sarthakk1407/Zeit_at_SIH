<script>
Object.assign(TERMS, {

/* ---------- machine learning ---------- */
"supervised":["Training a model on input–answer pairs.","Noisy audio in, the clean version as the answer. It only works because we can MAKE the pairs by mixing known clean speech with known noise — which is why Type A range takes are evaluation data only."],
"holdout":["Data deliberately set aside and never looked at during development.","Assigned by plan.py at range-planning time, before any recording exists, precisely so it cannot be chosen conveniently afterwards. The generator is compared against it and nothing else."],
"generalisation":["Performing well on data never seen during training.","The whole point. Wang & Chen's finding is that training-data quality and diversity decide it — which is why 35% impulsive / 35% non-stationary / 30% stationary matters more than architecture."],
"overfitting":["A model learning the specific examples rather than the general pattern — excellent on training data, useless on anything new.","Guarded against by dynamic on-the-fly mixing with a seeded config, so SNR and room response are resampled every epoch rather than fixed."],
"ablation":["Removing one component at a time to see what it actually contributed.","H-GTCRN's ablation is where three of our design choices come from: mask the noisy input, use log-power features, feed both separated streams."],
"data augmentation":["Artificially expanding training data by transforming it — adding noise, reverberation, clipping, pitch shifts.","Where α-stable noise enters. The α-stable paper's own conclusion names audio as unexplored future work, which is our opening."],
"GTCRN":["Grouped Temporal Convolutional Recurrent Network (Rong et al., ICASSP 2024). 23.7 K parameters, 39.6 MMAC/s.","Block 7 — the only learned block, and the AI/ML the PS requires. Quote both size accountings: the paper says 23.7 K / 39.6 MMAC/s, the official code says 48.2 K / 33.0."],
"parameter":["One learned number inside a model.","GTCRN has ~24,000. A large speech model has hundreds of millions. Parameter count drives memory; MAC count drives speed."],
"convolution":["A layer that slides a small pattern-detector across the input, reusing the same weights everywhere.","Efficient, and well suited to spectrograms where a pattern means the same thing wherever it appears."],
"Grouped convolution":["Splitting channels into groups processed independently, then shuffling so information still crosses between them.","One of GTCRN's four size tricks — far fewer connections for nearly the same capability."],
"channel shuffle":["Rearranging channels between grouped layers so information can cross group boundaries.","Without it, groups never talk to each other and the model loses capability. Borrowed from ShuffleNetV2."],
"dilated convolution":["A convolution with gaps between the samples it looks at, covering a wider span for the same cost.","GTCRN dilates by 1, 2 and 5 in successive blocks, so it sees further back in time without more compute."],
"RNN":["Recurrent Neural Network — a layer with memory, carrying a hidden state from one time step to the next.","What lets the model use context rather than judging each frame alone. GTCRN uses GRUs, the smaller of the two standard designs."],
"bidirectional":["A recurrent layer reading a sequence both forwards and backwards.","Non-causal in time — but GTCRN uses it ACROSS FREQUENCY within a single frame, which is perfectly causal. Time is modelled by a unidirectional GRU."],
"causality":["Using only past and present information, never the future.","Mandatory for a real-time system. It also means non-causal published results are not comparable to ours, which is worth checking before citing a number."],
"encoder–decoder":["Compress the input to a compact representation, then expand it back to full size.","GTCRN's shape: two convolution blocks and three grouped temporal convolution blocks down, a grouped dual-path RNN in the middle, a mirrored decoder up, with skip connections."],
"skip connection":["A shortcut carrying detail from the compression side directly to the expansion side.","Stops fine spectral structure being lost in the squeeze — which matters here because fine structure is exactly what intelligibility depends on."],
"attention":["A mechanism letting a model weight some parts of its input more than others.","TRA is a lightweight version applied along the time axis."],
"TRA":["Temporal Recurrent Attention — pool energy across frequency to get a per-frame energy curve, run it through a small GRU and a dense layer, and use the sigmoid output to weight moments in time.","GTCRN's contribution over plain time attention, and it beats it for almost no extra compute: 21.65 K params and 34.47 MMAC/s versus 14.84 K and 34.00."],
"SFE":["Subband Feature Extraction — unfold each frequency band together with its k−1 neighbours and stack them into the channel dimension.","Lets the following convolution use frequency relationships directly. GTCRN uses kernel size 3 throughout."],
"loss function":["The number a model is trained to make small — its definition of 'wrong'.","Choosing it is choosing what the model optimises. Under heavy tails, squared error is dominated by outliers, which is cross-finding C and the motivation for the FLOM-loss stretch goal."],
"SI-SNR":["Scale-invariant signal-to-noise ratio — SNR that allows one overall gain adjustment, so it cannot be gamed by rescaling.","Used both as a training loss and as a reported metric. Preferred over raw SDR for the reason Le Roux et al. demonstrate."],
"pruning":["Removing weights from a trained model to make it smaller. Usually iterative: prune a little, retrain, repeat.","Stage 5 of the offline pipeline. The reference result is 290.44 K → 103.07 K parameters over six iterations, with STOI down only 0.72%."],
"sparse group lasso":["A penalty added during training that pushes entire groups of weights toward zero, making them safe to remove.","How structured pruning is actually achieved. Applied per convolution kernel and per LSTM matrix column."],
"sensitivity analysis":["Testing how much each layer can be pruned before quality drops, so pruning is distributed intelligently rather than uniformly.","Run per tensor before each pruning iteration."],
"quantisation":["Storing and computing weights in 8-bit integers instead of 32-bit floats. Four times smaller and often faster.","The study the reference work never did. Report the ordering interaction: prune-then-quantise is not the same as quantise-then-prune, and enhancement is sensitive to reduced precision."],
"sparsity":["The fraction of weights that are effectively zero.","α-stable training produces measurably more of it — 59.49% versus 51.62% on CIFAR10-C — and nobody has pruned such a model. That gap is our one-experiment-two-deliverables opportunity."],
"ONNX":["Open Neural Network Exchange — a portable file format for trained models.","The ONLY thing crossing from Python to C++ in our design. That single rule is what keeps the two halves from entangling."],
"TensorRT":["NVIDIA's optimising inference engine. Faster than ONNX Runtime on NVIDIA hardware, useless elsewhere, and proprietary.","Named in the PS. Worth benchmarking only if the board turns out to be a Jetson."],

/* ---------- evaluation ---------- */
"SNR":["Signal-to-Noise Ratio in dB. Positive means speech is louder than noise.","Gunfire produces strongly negative SNR, down to −12 dB and below. The PS target of 'SNR > 15 dB' is ambiguous — output SNR or improvement? — and must be defined explicitly."],
"PESQ":["Perceptual Evaluation of Speech Quality — an ITU standard scoring roughly −0.5 to 4.5, modelling how humans rate quality against a clean reference.","PS target 2.5. GTCRN reaches 2.87 on VCTK-DEMAND, but H-GTCRN reaches only 1.71 at −2.5 dB SNR — which is why the target must be reported as a curve against input SNR."],
"STOI":["Short-Time Objective Intelligibility — 0 to 1, predicting what fraction of words a listener would understand.","PS target 0.85. Intelligibility, not pleasantness: speech can sound bad and still score well, which is exactly what makes it the right complement to PESQ."],
"DNSMOS":["A neural network trained on tens of thousands of human ratings that predicts subjective quality with no clean reference needed.","Earns its place because P.835 splits SIG from BAK, making over-suppression visible. Caveat: trained on English, served from Azure — both worth acknowledging in a DRDO deliverable."],
"NMSE":["Normalised Mean Squared Error in dB — how much noise energy is left. More negative is better.","Deep ANC's own metric, so a Lane A comparison against it is like-for-like. It is the correct metric for Lane A and the wrong one for Lane B."],
"FAD":["Fréchet Audio Distance — how similar two SETS of audio are in a learned feature space.","Meaningless without a floor. Split the real recordings in half and compute FAD(real, real) first; two genuine sets never match perfectly."],
"Diagnostic Rhyme Test":["An ANSI/ASA S3.2 intelligibility test where listeners pick which of two similar words they heard, differing by one phonetic feature.","What 'speech intelligibility' formally means to a defence evaluator. We will not run one, but naming it shows we know PESQ and STOI are proxies for it."],
"ANSI/ASA S3.2":["The American standard for subjectively evaluating the speech intelligibility of communication systems.","The rung above PESQ and STOI on the evaluation ladder, and the register a DRDO acoustics evaluator thinks in."],

/* ---------- real-time and embedded ---------- */
"real-time":["Not 'fast' — guaranteed to finish before a deadline, every time.","An average of 3 ms with occasional 12 ms spikes fails a 10 ms deadline. This is why we report worst case, not mean."],
"99th percentile":["The value 99% of measurements fall below.","The honest way to report frame timing, because the mean hides exactly the spikes that produce audible clicks."],
"SWaP-C":["Size, Weight, Power and Cost — the defence shorthand for what decides whether something can actually be carried and fielded.","The binding constraint on a soldier-worn headset, and the basis of the argument that 39.6 MMAC/s does not need a Jetson."],
"TRL":["Technology Readiness Level, 1 to 9. 1 is an idea, 3 is proof of concept, 5–6 is validated in a relevant environment, 9 is fielded.","DRDO's TDF raises technologies 'from TRL 3 onwards'; iDEX Prime targets TRL 4+. We are TRL 3–4, and saying so precisely beats overclaiming."],
"JSS 55555":["The Indian Joint Services Specification for environmental testing of military equipment — temperature, humidity, vibration, fungus, salt.","What 'ruggedised' formally means in Indian defence procurement. Naming which tests would apply is the difference between a student project and a proposal."],
"MIL-STD-1474":["The military noise-limits standard. Requires impulse peak levels below 140 dB at the ear, protected or unprotected — while few weapons produce below 150 dB.","The frame an acoustics evaluator will hear this project in. Our measured 140–155 dB muzzle blast figure lands inside a standard they already know."]

});
</script>
