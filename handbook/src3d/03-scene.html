<script>
(function(){
'use strict';
var L=document.getElementById('loading');
if(!window.THREE){L.textContent='three.js failed to load — check the network connection.';return;}

/* =====================================================================
   ZEIT prototype bench
   World scale: 1 unit = 10 mm. Component dimensions follow datasheets.

   Layout rule: every device lies flat on one bench plane so nothing
   towers over anything else, and the three functional zones — CAPTURE,
   COMPUTE, SINK — are spaced apart and marked on the bench surface.
   ===================================================================== */

function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hexOf(n){var v=css(n).replace('#','');return parseInt(v,16);}

var vp=document.getElementById('viewport');
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(34,1,0.5,2000);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
vp.insertBefore(renderer.domElement,vp.firstChild);

/* ---------------- lighting: soft studio ---------------- */
var hemi=new THREE.HemisphereLight(0xffffff,0x9aa0a6,0.78);scene.add(hemi);
var keyL=new THREE.DirectionalLight(0xffffff,0.60);keyL.position.set(40,70,50);scene.add(keyL);
var fillL=new THREE.DirectionalLight(0xffffff,0.26);fillL.position.set(-60,30,-30);scene.add(fillL);
var rimL=new THREE.DirectionalLight(0xffffff,0.20);rimL.position.set(0,20,-70);scene.add(rimL);

var grid=new THREE.GridHelper(600,60);grid.position.y=-1.4;scene.add(grid);
grid.material.transparent=true;grid.material.opacity=.24;

var COL={};
function readColours(){
  COL.m1=hexOf('--m1');COL.m2=hexOf('--m2');COL.m3=hexOf('--m3');
  COL.spk=hexOf('--spk');COL.src=hexOf('--src');COL.text=hexOf('--text');
  COL.ok=hexOf('--ok');COL.laneA=hexOf('--laneA');COL.laneB=hexOf('--laneB');
}
readColours();

/* ---------------- material library ---------------- */
function std(c,r,m,o){
  var p={color:c,roughness:r===undefined?.6:r,metalness:m===undefined?.1:m};
  if(o!==undefined){p.transparent=true;p.opacity=o;}
  return new THREE.MeshStandardMaterial(p);
}
var MAT={
  bench    : std(0xdcdce0,.94,.02),
  benchTop : std(0xe6e6ea,.96,.01),
  skin     : std(0xd6d6da,.95,.00,.52),
  plastic  : std(0xb4b4ba,.55,.10),
  plasticD : std(0x4a4a50,.60,.10),
  foam     : std(0x5c5c62,.97,.00),
  metal    : std(0xb9bcc0,.34,.72),
  metalD   : std(0x8c8f94,.42,.68),
  gold     : std(0xc9a227,.34,.85),
  pcb      : std(0x0f7a46,.72,.06),   // Raspberry Pi green
  pcbBlue  : std(0x14406e,.70,.06),   // Lane A DSP module
  black    : std(0x16161a,.62,.14),
  white    : std(0xf2f2f4,.62,.02),
  usb3     : std(0x1f4fa8,.60,.10),
  behringer: std(0x9d1b1b,.46,.22),   // UMC202HD body
  behrDark : std(0x6d1212,.52,.24),
  knob     : std(0x2a2a2e,.52,.22),
  rubber   : std(0x202024,.94,.02),
  screen   : std(0x101014,.28,.10)
};

function applyTheme(){
  readColours();
  var bg=new THREE.Color(css('--scene')||'#ececed');
  scene.background=bg;
  scene.fog=new THREE.Fog(bg.getHex(),280,820);
  grid.material.color=new THREE.Color(css('--grid')||'#c9c9ce');
  var dark=bg.r<0.4;
  hemi.intensity=dark?0.44:0.78;
  keyL.intensity=dark?0.52:0.60;
  MAT.bench.color.setHex(dark?0x141416:0xdcdce0);
  MAT.benchTop.color.setHex(dark?0x1b1b1e:0xe6e6ea);
  MAT.skin.color.setHex(dark?0x6a6a74:0xd6d6da);
  MAT.plastic.color.setHex(dark?0x53535a:0xb4b4ba);
  MAT.metal.color.setHex(dark?0x8b8e93:0xb9bcc0);
  MAT.white.color.setHex(dark?0xcfcfd4:0xf2f2f4);
}

/* ---------------- scene graph ----------------
   Groups are tagged by lane so the lane filter can isolate either
   system without the other's hardware in the frame.                */
var root=new THREE.Group();scene.add(root);
var gBench=new THREE.Group();   // slab + zone outlines
var gHead =new THREE.Group();   // head + headset + stand   (both lanes)
var gLaneA=new THREE.Group();   // FxLMS module + the anti-noise loop
var gIface=new THREE.Group();   // UMC202HD                 (lane B)
var gPi   =new THREE.Group();   // Pi 5 + cooler + PSU      (lane B)
var gRadio=new THREE.Group();   // communication unit       (lane B)
var gField=new THREE.Group();   // source, trajectory, wavefronts
var gCabA =new THREE.Group();   // lane A cabling
var gCabB =new THREE.Group();   // lane B cabling
var gFlow =new THREE.Group();   // signal-flow markers
root.add(gBench,gHead,gLaneA,gIface,gPi,gRadio,gField,gCabA,gCabB,gFlow);

/* ---------------- bench slab, sized to its contents ---------------- */
var BENCH={x0:-56,x1:44,z0:-20,z1:20};
(function(){
  var w=BENCH.x1-BENCH.x0, d=BENCH.z1-BENCH.z0, cx=(BENCH.x0+BENCH.x1)/2, cz=(BENCH.z0+BENCH.z1)/2;
  var slab=new THREE.Mesh(new THREE.BoxGeometry(w,1.2,d),MAT.bench);
  slab.position.set(cx,-0.6,cz);gBench.add(slab);
  var top=new THREE.Mesh(new THREE.BoxGeometry(w-0.6,0.06,d-0.6),MAT.benchTop);
  top.position.set(cx,0.02,cz);gBench.add(top);
})();

/* zone outlines drawn on the bench surface, like a layout drawing */
var ZONES=[
  {x0:-52,x1:-24,z0:-13,z1:13,t:'CAPTURE'},
  {x0:-19,x1: 22,z0:-13,z1:13,t:'COMPUTE'},
  {x0: 26,x1: 41,z0:-13,z1:13,t:'SINK'}
];
(function(){
  var lm=new THREE.LineBasicMaterial({color:COL.text,transparent:true,opacity:.17});
  ZONES.forEach(function(z){
    var p=[new THREE.Vector3(z.x0,0.08,z.z0),new THREE.Vector3(z.x1,0.08,z.z0),
           new THREE.Vector3(z.x1,0.08,z.z1),new THREE.Vector3(z.x0,0.08,z.z1),
           new THREE.Vector3(z.x0,0.08,z.z0)];
    var l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),lm);
    gBench.add(l);
    z.anchor=new THREE.Vector3((z.x0+z.x1)/2,0.4,z.z1+1.2);
  });
})();

/* ---------------- damped orbit camera ---------------- */
var tgt   ={x:-6,y:9,z:0};
var tgtTo ={x:-6,y:9,z:0};
var cam   ={r:126,th:0.60,ph:1.10};
var camTo ={r:126,th:0.60,ph:1.10};
var drag=null,lx=0,ly=0,pointers={},pinch0=0,userMoved=0;

function clampCam(o){
  o.ph=Math.max(0.10,Math.min(Math.PI-0.10,o.ph));
  o.r =Math.max(7,Math.min(520,o.r));
}
function placeCamera(){
  camera.position.set(
    tgt.x+cam.r*Math.sin(cam.ph)*Math.sin(cam.th),
    tgt.y+cam.r*Math.cos(cam.ph),
    tgt.z+cam.r*Math.sin(cam.ph)*Math.cos(cam.th));
  camera.lookAt(tgt.x,tgt.y,tgt.z);
}
function dampCamera(dt){
  var k=1-Math.pow(0.0016,dt/1000);
  clampCam(camTo);
  cam.r  += (camTo.r  - cam.r )*k;
  cam.th += (camTo.th - cam.th)*k;
  cam.ph += (camTo.ph - cam.ph)*k;
  tgt.x  += (tgtTo.x  - tgt.x )*k;
  tgt.y  += (tgtTo.y  - tgt.y )*k;
  tgt.z  += (tgtTo.z  - tgt.z )*k;
  placeCamera();
}

vp.addEventListener('pointerdown',function(e){
  pointers[e.pointerId]=e;
  if(Object.keys(pointers).length===1){
    drag=(e.button===2||e.shiftKey)?'pan':'orbit';lx=e.clientX;ly=e.clientY;
    try{vp.setPointerCapture(e.pointerId);}catch(err){}
    userMoved=0;spin=false;syncTog();
  }else drag=null;
});
vp.addEventListener('pointermove',function(e){
  if(!(e.pointerId in pointers))return;
  pointers[e.pointerId]=e;
  var ids=Object.keys(pointers);
  if(ids.length===2){
    var a=pointers[ids[0]],b=pointers[ids[1]];
    var d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(pinch0>0){camTo.r*=pinch0/d;}
    pinch0=d;return;
  }
  if(!drag)return;
  var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  userMoved+=Math.abs(dx)+Math.abs(dy);
  if(drag==='orbit'){camTo.th-=dx*.0052;camTo.ph-=dy*.0052;}
  else{
    var right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
    var up   =new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
    var s=camTo.r*.0013;
    tgtTo.x+=(-dx*right.x+dy*up.x)*s;
    tgtTo.y+=(-dx*right.y+dy*up.y)*s;
    tgtTo.z+=(-dx*right.z+dy*up.z)*s;
  }
});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  vp.addEventListener(ev,function(e){
    delete pointers[e.pointerId];
    if(Object.keys(pointers).length<2)pinch0=0;
    if(Object.keys(pointers).length===0)drag=null;
  });
});
vp.addEventListener('contextmenu',function(e){e.preventDefault();});
vp.addEventListener('wheel',function(e){
  e.preventDefault();camTo.r*=(1+Math.sign(e.deltaY)*.11);spin=false;syncTog();
},{passive:false});

/* ---------------- camera presets ---------------- */
var VIEWS={
  system :{r:126,th:.60,ph:1.10,t:[  -6, 9,  0],lab:'System overview'},
  headset:{r:32 ,th:.78,ph:1.18,t:[ -40,17,  0],lab:'Headset — three microphones'},
  earcup :{r:20 ,th:.40,ph:1.02,t:[-29.8,16.6,0.8],lab:'Earcup cutaway — Lane A loop'},
  iface  :{r:26 ,th:.55,ph:1.04,t:[ -10, 3,  0],lab:'Audio interface — UMC202HD'},
  pi     :{r:23 ,th:.70,ph:0.96,t:[  12, 3,  0],lab:'Raspberry Pi 5 — the Lane B engine'},
  radio  :{r:24 ,th:.62,ph:0.94,t:[  33, 2,  0],lab:'Communication unit — Lane B sink'},
  field  :{r:400,th:.86,ph:1.14,t:[-130,12, 96],lab:'Field — source at 30 m'}
};
function goView(k){
  var v=VIEWS[k];if(!v)return;
  camTo.r=v.r;camTo.th=v.th;camTo.ph=v.ph;
  tgtTo.x=v.t[0];tgtTo.y=v.t[1];tgtTo.z=v.t[2];
  document.getElementById('stagelab').textContent=v.lab;
}
